name: Deploy iPad Launcher

on:
  push:
    branches:
      - main
      - cursor/ipad-mac-launcher-8f7f
    paths:
      - "ipad-mac-launcher/**"
      - ".github/workflows/ipad-launcher-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ipad-launcher-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload launcher
        uses: actions/upload-pages-artifact@v4
        with:
          path: ipad-mac-launcher

      - name: Deploy launcher
        id: deployment
        uses: actions/deploy-pages@v4
